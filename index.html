<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Kelly</title>
<meta name="description" content="A few questions about the ring you’d love.">
<meta property="og:type" content="website">
<meta property="og:title" content="For Kelly">
<meta property="og:description" content="A few questions about the ring you’d love.">
<meta property="og:image" content="https://franktomasello.github.io/questions/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#EEEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14152A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 6h14l6 7-13 14L3 13z' fill='%23F6EBD3' stroke='%23A3804A' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M3 13h26M9 6l3 7 4 14 4-14 3-7M12 13l4-7 4 7' fill='none' stroke='%23A3804A' stroke-width='1.1' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEFF4; --sheen:#FFFFFF; --surface:#F8F8FB; --ink:#23233B; --muted:#676982; --line:#D3D5E1;
  --gold:#A3804A; --love:#AE4566; --love-soft:#F5E5EB; --muted-strong:#55576F; --on-ink:#F8F8FB; --finger:#E0D6CE; --gem:#FFFFFF;
  --serif:"Bodoni Moda","Bodoni 72","Didot","Bodoni MT",Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14152A; --sheen:#232445; --surface:#1C1D36; --ink:#ECEAF3; --muted:#A4A6C1; --line:#34365B;
    --gold:#D4B67E; --love:#EA86A3; --love-soft:#3A2338; --muted-strong:#B9BBD3; --on-ink:#14152A; --finger:#4B4357; --gem:#2A2B4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14152A; --sheen:#232445; --surface:#1C1D36; --ink:#ECEAF3; --muted:#A4A6C1; --line:#34365B;
  --gold:#D4B67E; --love:#EA86A3; --love-soft:#3A2338; --muted-strong:#B9BBD3; --on-ink:#14152A; --finger:#4B4357; --gem:#2A2B4A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input[type=range]{touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.foot{background:var(--bg)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) and (background:color-mix(in srgb,red 50%,blue)){
  .top,.foot{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
}
.top-inner{max-width:640px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.top-title{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1;white-space:nowrap}
.dots{display:flex;align-items:center;gap:4px;margin-right:-5px}
.dot{width:22px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.dot i{display:block;width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--muted);transition:background .25s,border-color .25s,transform .25s}
.dot[data-s="done"] i{background:var(--ink);border-color:var(--ink)}
.dot[data-s="cur"] i{background:var(--gold);border-color:var(--gold);transform:rotate(45deg) scale(1.45)}
.dot.review i{border-radius:50%;transform:none}
.dot.review[data-s="cur"] i{transform:scale(1.35)}

#app{flex:1;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:34px 24px 150px}

/* intro */
.intro{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 24px 56px;overflow:hidden}
.intro::before{content:"";position:absolute;left:50%;top:-12%;width:150vmax;height:80vmax;transform:translateX(-50%);background:radial-gradient(closest-side,var(--sheen),transparent);opacity:.9;pointer-events:none}
.intro>*{position:relative}
.gem{position:relative}
.gem svg{display:block;width:min(212px,56vw);height:auto;fill:none;stroke:var(--gold);stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.gem.small svg{width:92px}
.facet{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.65,0,.25,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.glint{fill:var(--gold);stroke:none;transform-box:fill-box;transform-origin:center;opacity:0;animation:glint 1.1s ease-out 1.75s forwards}
@keyframes glint{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(.3) rotate(110deg)}}
.kelly{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(78px,23vw,138px);line-height:.92;letter-spacing:-.02em;margin:28px 0 24px;padding:0 .08em;font-optical-sizing:auto}
.lede{font-size:19px;line-height:1.5;max-width:29ch;margin:0 auto;text-wrap:balance}
.sign{font-family:var(--serif);font-style:italic;font-size:20px;margin:12px 0 0}
.meta{color:var(--muted);font-size:15px;max-width:33ch;margin:24px auto 0}
.intro-actions{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:30px}
.fade{opacity:0;transform:translateY(8px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.still .facet{animation:none;stroke-dashoffset:0}
.still .fade{animation:none;opacity:1;transform:none}
.still .glint{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:999px;padding:12px 28px;font-size:16px;font-weight:500;letter-spacing:.01em;cursor:pointer;text-decoration:none;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:transparent;padding-left:10px;padding-right:10px}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn svg{width:18px;height:18px;flex:none}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--muted);font-size:14.5px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}

/* steps */
.step h1,.review h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,9vw,48px);line-height:1.04;letter-spacing:-.01em;margin:0 0 12px;font-optical-sizing:auto;outline:none;text-wrap:balance}
.step .note,.review .note{color:var(--muted);margin:0 0 42px;max-width:42ch;font-size:16.5px;text-wrap:pretty}
.enter-f{animation:enterF .38s cubic-bezier(.2,.7,.2,1)}
.enter-b{animation:enterB .38s cubic-bezier(.2,.7,.2,1)}
@keyframes enterF{from{opacity:0;transform:translateX(22px)}}
@keyframes enterB{from{opacity:0;transform:translateX(-22px)}}
.q{margin:0 0 48px}
.q-label{font-weight:500;font-size:18.5px;line-height:1.35;margin:0 0 14px;text-wrap:balance}
.q-label.has-hint{margin-bottom:4px}
.q-hint{font-size:14.5px;color:var(--muted);margin:0 0 16px;max-width:50ch;text-wrap:pretty}

/* single choice */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;text-align:left;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-size:16.5px;line-height:1.35}
.ind{flex:none;width:24px;height:24px}
.ind svg{width:24px;height:24px;display:block;overflow:visible}
.ind .b{fill:none;stroke:var(--line);stroke-width:1.6;transition:stroke .2s}
.ind .s{fill:var(--gold);opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:translateY(3px) scale(.3);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.row[aria-checked="true"] .ind .b{stroke:var(--ink)}
.row[aria-checked="true"] .ind .s{opacity:1;transform:none}

/* multi choice */
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 17px;min-height:44px;font-size:15.5px;line-height:1.25;cursor:pointer;transition:background .18s,color .18s,border-color .18s,opacity .18s}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pills.full .pill[aria-pressed="false"]{opacity:.45}
.pills.small{gap:8px}
.pills.small .pill{min-height:34px;padding:6px 13px;font-size:14px}
.counter{font-size:13.5px;color:var(--muted);margin:12px 0 0}

/* rating tiles */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:13px;height:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tiles-setting,.tiles-stone,.tiles-metal{grid-template-columns:repeat(auto-fill,minmax(142px,1fr))}
.tile{--chip-bg:var(--surface);position:relative;background:var(--chip-bg);border:1px solid var(--line);border-radius:16px;padding:16px 10px 13px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-align:center;color:var(--ink);transition:background .2s,border-color .2s,opacity .2s,transform .12s}
.tile:active{transform:scale(.97)}
.tile .art{display:block;color:var(--ink);margin-bottom:7px;transition:color .2s}
.tile .art svg{display:block;width:58px;height:58px;fill:none;stroke:currentColor;stroke-linejoin:round;stroke-linecap:round}
.tiles-setting .tile .art svg{width:86px;height:52px}
.tiles-metal .tile .art svg{width:78px;height:64px}
.tile .fill{fill:var(--chip-bg)}
.tile .gemfill{fill:var(--gem)}
.tile .dot{fill:currentColor;stroke:none}
.tile .ol{stroke-width:1.3}
.tile .fc{stroke-width:.6;opacity:.62}
.tname{font-size:14.5px;line-height:1.25}
.tsub{font-size:12.5px;line-height:1.3;color:var(--muted);text-wrap:balance}
.tile[data-state="love"]{--chip-bg:var(--love-soft);border-color:var(--love)}
.tile[data-state="love"] .art{color:var(--love)}
.tile[data-state="no"]{--chip-bg:transparent;border-style:dashed}
.tile[data-state="no"] .art{opacity:.3}
.tile[data-state="no"] .tname{text-decoration:line-through;color:var(--muted)}
.tile[data-state="love"] .tsub{color:var(--muted-strong)}
.badge{position:absolute;top:8px;right:9px;width:16px;height:16px}
.badge svg{width:16px;height:16px;display:block;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.hrt{fill:var(--love)}
.xm{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* size */
.sizer{display:grid;grid-template-columns:132px 1fr;gap:22px;align-items:center}
.finger svg{display:block;width:132px;height:auto}
.finger .fing{fill:var(--finger)}
.finger .nail{fill:var(--sheen);opacity:.5}
.finger .band{fill:var(--gold)}
.finger .st{fill:var(--gem);stroke:var(--ink);stroke-width:.3;stroke-linejoin:round;filter:drop-shadow(0 .5px .6px rgba(20,20,40,.28))}
.finger .sf{fill:none;stroke:var(--ink);stroke-width:.15;opacity:.65;stroke-linejoin:round}
.size-name{font-family:var(--serif);font-size:31px;line-height:1.1;margin:0}
.size-ct{color:var(--muted);font-size:15px;margin:4px 0 18px;min-height:1.5em}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:34px;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--gold) var(--p,25%),var(--line) var(--p,25%));border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-progress{height:2px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:5px solid var(--bg);box-shadow:0 0 0 1px var(--ink);margin-top:-12px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:5px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.preview-as{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.preview-as span{font-size:13.5px;color:var(--muted);margin-right:2px}
.fine{font-size:13.5px;color:var(--muted);margin:14px 0 0;grid-column:1/-1}

/* this or that */
.tot{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.pair button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:13px 10px;min-height:50px;font-size:15.5px;line-height:1.25;cursor:pointer;transition:background .18s,color .18s,border-color .18s,transform .12s}
.pair button:active{transform:scale(.97)}
.pair button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.or{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px}

/* ranking */
.rank{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rk{display:flex;align-items:center;gap:14px;padding:11px 2px;min-height:54px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:16.5px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:15px;transition:background .18s,color .18s,border-color .18s}
.rk.on .num{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* fields */
.field{width:100%;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;line-height:1.45}
.field::placeholder{color:var(--muted);opacity:.85}
textarea.field{min-height:108px;resize:none;overflow:hidden}
.field:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:transparent}
select.field{-webkit-appearance:none;appearance:none;padding-right:42px;max-width:250px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 53%,calc(100% - 16px) 53%;background-size:6px 6px;background-repeat:no-repeat}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot{transition:transform .25s ease}
body.typing .foot{transform:translateY(110%)}
.foot-inner{max-width:640px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}

/* review */
.report{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 22px 6px}
.report::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-color:color-mix(in srgb,var(--gold) 50%,transparent);border-radius:4px;pointer-events:none}
.r-top{display:flex;align-items:center;gap:14px;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.r-top svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--gold);stroke-linejoin:round}
.r-top p{margin:0;font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.1}
.r-top small{display:block;font-family:var(--sans);font-style:normal;font-size:13px;color:var(--muted);margin-top:3px}
.r-sec{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.r-sec:last-child{border-bottom:0}
.r-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.r-head h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:21px;line-height:1.2;margin:0}
.r-head .linkbtn{padding:6px 2px;font-size:14px}
.review dl{margin:0;display:grid;gap:12px}
.review dt{font-size:13px;color:var(--muted);line-height:1.3}
.review dd{margin:2px 0 0;font-size:16px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.r-empty{color:var(--muted);font-size:15px;margin:0}
.r-chips{display:flex;flex-wrap:wrap;gap:6px 14px}
.r-chips span{display:inline-flex;align-items:center;gap:6px}
.r-chips svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-linejoin:round}
.r-chips .ol{stroke-width:1.5}
.r-chips .fc{stroke-width:.7;opacity:.6}
.r-chips .fill,.r-chips .gemfill{fill:var(--surface)}
.r-chips .love{color:var(--love)}
.r-chips .love .hrt{fill:var(--love)}
.r-chips svg:has(.hrt){width:13px;height:13px}
.r-chips .no{color:var(--muted);text-decoration:line-through}
.send-note{font-size:14.5px;color:var(--muted);margin:22px 2px 0;text-align:center}

/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px 64px;max-width:520px;margin:0 auto;width:100%}
.done h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(44px,12vw,60px);line-height:1.04;margin:26px 0 14px}
.status{font-size:17.5px;max-width:30ch;margin:0 auto}
.status small{display:block;color:var(--muted);font-size:14.5px;margin-top:10px;max-width:34ch;margin-left:auto;margin-right:auto}
.done-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:28px 0 10px}
.raw{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

@media (prefers-reduced-motion:reduce){
  .facet{animation:none;stroke-dashoffset:0}
  .fade{animation:none;opacity:1;transform:none}
  .glint{display:none}
  .enter-f,.enter-b,.badge svg{animation:none}
  .ind .s,.dot i{transition:none}
}
@media (max-width:389px){
  .dots{gap:1px}
  .dot{width:19px}
  .top-inner{padding-left:20px;padding-right:20px}
}
@media (max-width:349px){
  .sizer{grid-template-columns:104px 1fr;gap:16px}
  .finger svg{width:104px}
  .wrap{padding-left:20px;padding-right:20px}
  .dot{width:17px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7E3A6"/><stop offset=".45" stop-color="#C4983A"/><stop offset=".7" stop-color="#E9C676"/><stop offset="1" stop-color="#B38830"/></linearGradient>

    {id:"tot",type:"tot",label:"Pick one from each pair.",hint:"Skip any you truly can’t decide on.",sum:"Gut picks",pairs:[["Bigger stone","Finer stone"],["Timeless","One of a kind"],["Maximum sparkle","Soft glow"],["Dainty","Bold"],["Blends in","Gets noticed"],["Famous brand","Small jeweler"],["Brand new","Vintage"],["Diamond","Something colorful"]]},
    {id:"rank",type:"rank",label:"Tap these in order of what matters most to you.",hint:"Tap one again to take it out.",sum:"Priorities, most important first",options:["Size","Sparkle","Whiteness (color)","Flawlessness (clarity)","Ethical sourcing","Uniqueness","Durability for everyday wear","Brand name"]}
  ]},
  {title:"The last few",note:"In your own words.",qs:[
    {id:"nos",type:"area",label:"Anything you definitely don’t want?",sum:"Definitely not",ph:"Shapes, styles, metals, anything"},
    {id:"dream",type:"area",label:"Describe your dream ring.",sum:"Dream ring",ph:"However it comes to you"},
    {id:"heirloom",type:"single",label:"Is there a family stone or heirloom you’d want included?",sum:"Family heirloom",options:["Yes","Maybe","No"]},
    {id:"heirloomNote",type:"text",showIf:{q:"heirloom",in:["Yes","Maybe"]},label:"Tell me about it.",sum:"Heirloom details",ph:"Optional"},
    {id:"involve",type:"single",label:"How involved do you want to be?",sum:"Involvement",options:["Surprise me completely","Show me a short list","Let’s choose it together"]},
    {id:"else",type:"area",label:"Anything else I should know?",sum:"Anything else",ph:"Optional"}
  ]}
];
var N=STEPS.length, REVIEW=N, DONE=N+1;
var QMAP={};STEPS.forEach(function(st){st.qs.forEach(function(q){QMAP[q.id]=q;});});

/* ================= state ================= */
var KEY="kelly-ring-v2";
var S={answers:{},at:0,started:false,sent:false};
var view=-1,introPlayed=false,previewShape=null;
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==="object")for(var k in o)S[k]=o[k];}}catch(e){}
  if(!S.answers||typeof S.answers!=="object")S.answers={};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function setA(q,v){if(v===undefined||v===null)delete S.answers[q.id];else S.answers[q.id]=v;S.started=true;save();paintDots();}
function stepAnswered(i){return STEPS[i].qs.some(function(q){return S.answers[q.id]!=null;});}
function lovedShapes(){var v=S.answers.shapes||{};return SETS.shape.filter(function(s){return v[s.id]==="love";});}

/* ================= dom helper ================= */
function h(tag,attrs){
  var el=document.createElement(tag);attrs=attrs||{};
  for(var k in attrs){var v=attrs[k];if(v===false||v==null)continue;
    if(k==="class")el.className=v;else if(k==="html")el.innerHTML=v;else if(k==="value")el.value=v;
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v);}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}
  el.append(c.nodeType?c:document.createTextNode(String(c)));
}

/* ================= question builders ================= */
var B={
  single:function(q){
    var box=h("div",{class:"rows",role:"radiogroup","aria-labelledby":"l-"+q.id});
    q.options.forEach(function(o){
      box.append(h("button",{type:"button",class:"row",role:"radio","aria-checked":String(S.answers[q.id]===o),"data-k":o,onclick:function(){
        var nv=S.answers[q.id]===o?undefined:o;setA(q,nv);
        box.querySelectorAll(".row").forEach(function(b){b.setAttribute("aria-checked",String(b.getAttribute("data-k")===nv));});
        refreshConditionals();
      },onkeydown:function(e){
        if(["ArrowDown","ArrowRight","ArrowUp","ArrowLeft"].indexOf(e.key)<0)return;
        var rows=[].slice.call(box.querySelectorAll(".row")),i=rows.indexOf(e.currentTarget),d=(e.key==="ArrowDown"||e.key==="ArrowRight")?1:-1;
        e.preventDefault();rows[(i+d+rows.length)%rows.length].focus();
      }},h("span",{class:"ind",html:RING_IND}),h("span",{},o)));
    });
    return box;
  },
  multi:function(q){
    var box=h("div",{class:"pills",role:"group","aria-labelledby":"l-"+q.id}),count=q.max?h("p",{class:"counter","aria-live":"polite"}):null;
    var paint=function(){var arr=S.answers[q.id]||[];
      var full=!!q.max&&arr.length>=q.max;
      box.querySelectorAll(".pill").forEach(function(b){var on=arr.indexOf(b.getAttribute("data-k"))>=0;b.setAttribute("aria-pressed",String(on));
        if(full&&!on)b.setAttribute("aria-disabled","true");else b.removeAttribute("aria-disabled");});
      if(q.max){box.classList.toggle("full",arr.length>=q.max);count.textContent=arr.length?arr.length+" of "+q.max+" chosen":"";}};
    q.options.forEach(function(o){
      box.append(h("button",{type:"button",class:"pill","data-k":o,onclick:function(){
        var arr=(S.answers[q.id]||[]).slice(),i=arr.indexOf(o);
        if(i>=0)arr.splice(i,1);else{if(q.max&&arr.length>=q.max)return;
          if(q.exclusive){if(o===q.exclusive)arr=[];else arr=arr.filter(function(x){return x!==q.exclusive;});}
          arr.push(o);}
        setA(q,arr.length?arr:undefined);paint();
      }},o));
    });
    paint();return [box,count];
  },
  rate:function(q){
    var cur=S.answers[q.id]||{},grid=h("div",{class:"tiles tiles-"+q.set});
    var label=function(it,st){return it.name+(st==="love"?", loved":st==="no"?", not for me":"");};
    SETS[q.set].forEach(function(it){
      var st=cur[it.id]||"",badge=h("span",{class:"badge",html:st==="love"?HEART:st==="no"?XMARK:""});
      var b=h("button",{type:"button",class:"tile","data-state":st,"aria-label":label(it,st)},badge,h("span",{class:"art",html:it.svg}),h("span",{class:"tname"},it.name),it.sub?h("span",{class:"tsub"},it.sub):null);
      b.addEventListener("click",function(){
        var o=Object.assign({},S.answers[q.id]||{}),ns=!o[it.id]?"love":o[it.id]==="love"?"no":"";
        if(ns)o[it.id]=ns;else delete o[it.id];
        setA(q,Object.keys(o).length?o:undefined);
        b.setAttribute("data-state",ns);badge.innerHTML=ns==="love"?HEART:ns==="no"?XMARK:"";b.setAttribute("aria-label",label(it,ns));
      });
      grid.append(b);
    });
    return grid;
  },
  slider:function(q){
    var cur=S.answers[q.id],idx=cur==null?1:cur,loved=lovedShapes();
    if(!previewShape||(previewShape!=="round"&&!loved.some(function(s){return s.id===previewShape;})))previewShape=loved.length?loved[0].id:"round";
    var art=h("div",{class:"finger"}),name=h("p",{class:"size-name"}),ct=h("p",{class:"size-ct"}),fine=h("p",{class:"fine"});
    var input=h("input",{type:"range",min:"0",max:"4",step:"1",value:String(idx),"aria-labelledby":"l-"+q.id});
    var draw=function(){var v=+input.value,shapeName=(SETS.shape.filter(function(s){return s.id===previewShape;})[0]||{}).name||"Round";
      art.innerHTML=fingerSVG(previewShape,SIZES[v].c);name.textContent=SIZES[v].name;
      ct.textContent=S.answers[q.id]==null?"Slide to choose":SIZES[v].ct+", "+shapeName.toLowerCase();
      input.setAttribute("aria-valuetext",SIZES[v].name+", "+SIZES[v].ct);input.style.setProperty("--p",(v/4*100)+"%");
      fine.textContent="Drawn to scale on an average ring finger. "+(LOOKS[previewShape]||"");};
    var commit=function(){setA(q,+input.value);draw();};
    input.addEventListener("input",commit);input.addEventListener("change",commit);input.addEventListener("pointerup",commit);
    var wrap=h("div",{class:"sizer"},art,h("div",{},name,ct,input,h("div",{class:"ends","aria-hidden":"true"},h("span",{},"Delicate"),h("span",{},"Showstopper"))));
    var opts=loved.slice(0,4);if(opts.length&&!opts.some(function(s){return s.id==="round";}))opts.push({id:"round",name:"Round"});
    if(opts.length>1){
      var pills=h("div",{class:"pills small",role:"group","aria-label":"Preview shape"});
      opts.forEach(function(s){pills.append(h("button",{type:"button",class:"pill","aria-pressed":String(s.id===previewShape),"data-k":s.id,onclick:function(){
        previewShape=s.id;pills.querySelectorAll(".pill").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-k")===previewShape));});draw();}},s.name));});
      wrap.append(h("div",{class:"preview-as"},h("span",{},"Preview as"),pills));
    }
    wrap.append(fine);
    draw();return wrap;
  },
  tot:function(q){
    var cur=S.answers[q.id]||[],box=h("div",{class:"tot"});
    q.pairs.forEach(function(p,i){
      var row=h("div",{class:"pair",role:"group","aria-label":p[0]+" or "+p[1]});
      var mk=function(side){return h("button",{type:"button","aria-pressed":String(cur[i]===side),onclick:function(){
        var arr=(S.answers[q.id]||[]).slice();while(arr.length<q.pairs.length)arr.push(null);
        arr[i]=arr[i]===side?null:side;setA(q,arr.some(function(x){return x!==null;})?arr:undefined);
        row.querySelectorAll("button").forEach(function(b,j){b.setAttribute("aria-pressed",String(arr[i]===j));});
      }},p[side]);};
      row.append(mk(0),h("span",{class:"or","aria-hidden":"true"},"or"),mk(1));box.append(row);
    });
    return box;
  },
  rank:function(q){
    var box=h("div",{class:"rank"}),reset=h("button",{type:"button",class:"linkbtn"},"Start the order over");
    var paint=function(){var arr=S.answers[q.id]||[];
      box.querySelectorAll(".rk").forEach(function(b){var k=b.getAttribute("data-k"),i=arr.indexOf(k);
        b.classList.toggle("on",i>=0);b.querySelector(".num").textContent=i>=0?String(i+1):"";
        b.setAttribute("aria-label",k+(i>=0?", number "+(i+1):", not ranked yet"));});
      reset.hidden=!arr.length;};
    q.options.forEach(function(o){
      box.append(h("button",{type:"button",class:"rk","data-k":o,onclick:function(){
        var arr=(S.answers[q.id]||[]).slice(),i=arr.indexOf(o);if(i>=0)arr.splice(i,1);else arr.push(o);
        setA(q,arr.length?arr:undefined);paint();
      }},h("span",{class:"num","aria-hidden":"true"}),h("span",{},o)));
    });
    reset.addEventListener("click",function(){setA(q,undefined);paint();});
    paint();return [box,reset];
  },
  text:function(q){
    var i=h("input",{class:"field",type:"text",placeholder:q.ph||"","aria-labelledby":"l-"+q.id,autocomplete:"off",enterkeyhint:"done"});
    i.value=S.answers[q.id]||"";
    i.addEventListener("input",function(){setA(q,i.value.trim()?i.value:undefined);});
    i.addEventListener("keydown",function(e){if(e.key==="Enter")i.blur();});
    return i;
  },
  area:function(q){
    var t=h("textarea",{class:"field",rows:"3",placeholder:q.ph||"","aria-labelledby":"l-"+q.id});
    t.value=S.answers[q.id]||"";
    var fit=function(){t.style.height="auto";t.style.height=Math.max(108,t.scrollHeight+2)+"px";};
    t.addEventListener("input",function(){setA(q,t.value.trim()?t.value:undefined);fit();});
    requestAnimationFrame(fit);
    return t;
  },
  select:function(q){
    var s=h("select",{class:"field","aria-labelledby":"l-"+q.id});
    q.options.forEach(function(o){s.append(h("option",{value:o},o));});
    s.value=S.answers[q.id]||q.options[0];
    s.addEventListener("change",function(){setA(q,s.value===q.options[0]?undefined:s.value);});
    return s;
  }
};
function shown(q){return !q.showIf||q.showIf.in.indexOf(S.answers[q.showIf.q])>=0;}
function refreshConditionals(){
  document.querySelectorAll(".q[data-q]").forEach(function(el){var q=QMAP[el.getAttribute("data-q")];if(q&&q.showIf)el.hidden=!shown(q);});
}
function renderQ(q){
  return h("div",{class:"q","data-q":q.id,hidden:!shown(q)},
    q.label?h("p",{class:"q-label"+(q.hint?" has-hint":""),id:"l-"+q.id},q.label):null,
    q.hint?h("p",{class:"q-hint"},q.hint):null,
    q.legend?h("p",{class:"legend","aria-hidden":"true"},h("span",{html:HEART+"Love"}),h("span",{html:XMARK+"Not for me"}),h("span",{},"Tap again to clear")):null,
    B[q.type](q));
}

/* ================= summary ================= */
function fmt(q,v){
  if(v==null)return "";
  switch(q.type){
    case "multi":return v.join(", ");
    case "rate":{var it=SETS[q.set],L=[],X=[];it.forEach(function(x){if(v[x.id]==="love")L.push(x.name);else if(v[x.id]==="no")X.push(x.name);});
      return [L.length?"Loves "+L.join(", "):"",X.length?"Not for me: "+X.join(", "):""].filter(Boolean).join(". ");}
    case "slider":return SIZES[v].name+" ("+SIZES[v].ct.toLowerCase()+")";
    case "tot":return q.pairs.map(function(p,i){return v[i]==null?"":p[v[i]]+" over "+p[1-v[i]].toLowerCase();}).filter(Boolean).join("; ");
    case "rank":return v.map(function(x,i){return (i+1)+". "+x;}).join(", ");
    default:return String(v).trim();
  }
}
function summary(){
  var out=["Kelly’s ring answers"];
  STEPS.forEach(function(st){var lines=[];
    st.qs.forEach(function(q){if(!shown(q))return;var f=fmt(q,S.answers[q.id]);if(f)lines.push("- "+q.sum+": "+f);});
    if(lines.length){out.push("",st.title);out=out.concat(lines);}});
  if(out.length===1)out.push("","No answers yet.");
  return out.join("\n");
}
function smsHref(){return "sms:"+PHONE+"?&body="+encodeURIComponent(summary());}

/* ================= views ================= */
var app=document.getElementById("app"),topEl=document.getElementById("top"),foot=document.getElementById("foot"),footInner=document.getElementById("footInner"),dots=document.getElementById("dots");

var lastNav=0;
function nav(n){var t=Date.now();if(t-lastNav<350)return;lastNav=t;go(n);}
function go(n,fromPop){
  var dir=n>view?"f":"b";view=n;if(n>=0&&n<=REVIEW)S.at=n;save();
  if(!fromPop){try{history.pushState({v:n},"");}catch(e){}}
  render(dir);window.scrollTo(0,0);
}
window.addEventListener("popstate",function(e){
  var v=e.state&&typeof e.state.v==="number"?e.state.v:-1;
  if(v>=-1&&v<=DONE&&v!==view)go(v,true);
});

function paintDots(){
  if(!dots.childNodes.length){
    for(var i=0;i<=N;i++)(function(i){
      dots.append(h("button",{type:"button",class:"dot"+(i===N?" review":""),"aria-label":i<N?"Section "+(i+1)+", "+STEPS[i].title:"Review",onclick:function(){if(i!==view)nav(i);}},h("i",{})));
    })(i);
  }
  dots.querySelectorAll(".dot").forEach(function(d,i){
    var s=i===view?"cur":(i<N&&stepAnswered(i))?"done":"todo";
    d.setAttribute("data-s",s);
    if(i===view)d.setAttribute("aria-current","step");else d.removeAttribute("aria-current");
  });
}

function setFoot(left,right){footInner.innerHTML="";add(footInner,left);add(footInner,right);}

function render(dir){
  app.innerHTML="";
  var inFlow=view>=0&&view<=REVIEW;
  topEl.hidden=!inFlow;foot.hidden=!inFlow;
  if(inFlow)paintDots();
  if(view<0){app.append(introView());return;}
  if(view===DONE){app.append(doneView());return;}
  var anim=dir==="b"?"enter-b":"enter-f";
  var back=h("button",{type:"button",class:"btn ghost",onclick:function(){nav(view-1);}},"Back");
  if(view===REVIEW){
    app.append(reviewView(anim));
    setFoot(back,sendLink("btn"));
  }else{
    var st=STEPS[view];
    var sec=h("section",{class:"step wrap "+anim,"aria-labelledby":"st-h"},h("h1",{id:"st-h",tabindex:"-1"},st.title),st.note?h("p",{class:"note"},st.note):null);
    st.qs.forEach(function(q){sec.append(renderQ(q));});
    app.append(sec);
    setFoot(back,h("button",{type:"button",class:"btn",onclick:function(){nav(view+1);}},view===N-1?"Review my answers":"Continue"));
  }
  var hd=app.querySelector("h1");if(hd&&dir&&view>=0)try{hd.focus({preventScroll:true});}catch(e){}
}

function sendLink(cls){
  var a=h("a",{class:cls,href:smsHref(),html:MSG_ICON+"<span>Text my answers to Frank</span>"});
  a.addEventListener("click",function(){a.href=smsHref();S.sent=true;save();setTimeout(function(){if(view!==DONE)go(DONE);},700);});
  return a;
}

function introView(){
  var has=S.started||Object.keys(S.answers).length>0;
  var sec=h("section",{class:"intro"+(introPlayed?" still":"")});introPlayed=true;
  var d=function(s){return "animation-delay:"+s+"s";};
  var label=!has?"Begin":S.sent?"See my answers":"Pick up where you left off";
  var start=h("button",{type:"button",class:"btn",onclick:function(){go(!has?0:S.sent?REVIEW:Math.max(0,Math.min(S.at||0,REVIEW)));}},label);
  var clear=null;
  if(has){var armed=false;clear=h("button",{type:"button",class:"linkbtn"},"Start over");
    clear.addEventListener("click",function(){if(!armed){armed=true;clear.textContent="Tap again to clear your answers";return;}
      S={answers:{},at:0,started:false,sent:false};previewShape=null;save();go(0);});}
  add(sec,[
    h("div",{class:"gem",html:heroSVG()}),
    h("h1",{class:"kelly fade",style:d(1.15)},"Kelly"),
    h("p",{class:"lede fade",style:d(1.45)},"A few questions about the ring you’d love, so I can get it exactly right."),
    h("p",{class:"sign fade",style:d(1.6)},"Love, Frank"),
    h("p",{class:"meta fade",style:d(1.75)},"It takes about eight minutes. Skip anything you like, and your answers save as you go."),
    h("div",{class:"intro-actions fade",style:d(1.9)},start,clear)
  ]);
  return sec;
}

function reviewValue(q,v){
  if(q.type==="rate"){
    var wrap=h("div",{class:"r-chips"});
    SETS[q.set].forEach(function(it){var s=v[it.id];if(!s)return;
      var icon=q.set==="shape"?gemSVG(it.id):"";
      wrap.append(h("span",{class:s==="love"?"love":"no",html:icon||(s==="love"?HEART:"")},it.name));});
    return wrap;
  }
  if(q.type==="tot")return q.pairs.map(function(p,i){return v[i]==null?null:p[v[i]]+" over "+p[1-v[i]].toLowerCase();}).filter(Boolean).join("\n");
  if(q.type==="rank")return v.map(function(x,i){return (i+1)+". "+x;}).join("\n");
  if(q.type==="slider")return SIZES[v].name+", "+SIZES[v].ct.toLowerCase();
  return fmt(q,v);
}

function reviewView(anim){
  var count=0,total=0;STEPS.forEach(function(st){st.qs.forEach(function(q){if(!shown(q))return;total++;if(S.answers[q.id]!=null)count++;});});
  var date=new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
  var report=h("div",{class:"report"},h("div",{class:"r-top",html:miniDiamond()},h("p",{},"Kelly’s ring",h("small",{},count+" of "+total+" answered, "+date))));
  STEPS.forEach(function(st,i){
    var dl=h("dl",{});
    st.qs.forEach(function(q){var v=S.answers[q.id];if(v==null||!shown(q))return;dl.append(h("div",{},h("dt",{},q.sum),h("dd",{},reviewValue(q,v))));});
    report.append(h("div",{class:"r-sec"},
      h("div",{class:"r-head"},h("h2",{},st.title),h("button",{type:"button",class:"linkbtn","aria-label":"Edit "+st.title,onclick:function(){go(i);}},"Edit")),
      dl.childNodes.length?dl:h("p",{class:"r-empty"},"Skipped")));
  });
  return h("section",{class:"review wrap "+anim,"aria-labelledby":"st-h"},
    h("h1",{id:"st-h",tabindex:"-1"},"Look it over"),
    h("p",{class:"note"},"Change anything you like. When it feels right, send it to me."),
    report,
    h("p",{class:"send-note"},"Messages opens with everything filled in. Just hit send."));
}

function doneView(){
  var copyBtn=h("button",{type:"button",class:"btn line"},"Copy my answers");
  var raw=h("textarea",{class:"raw",readonly:true,"aria-hidden":"true",tabindex:"-1"});raw.value=summary();
  copyBtn.addEventListener("click",async function(){
    var t=summary(),ok=false;
    try{await navigator.clipboard.writeText(t);ok=true;}catch(e){}
    if(!ok){try{raw.value=t;raw.readOnly=false;raw.focus({preventScroll:true});raw.setSelectionRange(0,t.length);ok=document.execCommand("copy");raw.readOnly=true;raw.blur();}catch(e){}}
    copyBtn.textContent=ok?"Copied":"Couldn’t copy, try again";
  });
  return h("section",{class:"done enter-f"},
    h("div",{class:"gem small still",html:heroSVG()}),
    h("h1",{tabindex:"-1"},"Thank you, Kelly."),
    h("p",{class:"status"},"Once you hit send in Messages, your answers are on their way to me.",
      h("small",{},"If Messages didn’t open, copy your answers and text them to me instead.")),
    h("div",{class:"done-actions"},sendLink("btn"),copyBtn),
    h("button",{type:"button",class:"linkbtn",onclick:function(){go(REVIEW);}},"Look over my answers"),
    raw);
}

/* tuck the footer away only while an on-screen keyboard is actually open */
if(window.visualViewport){
  var VV=window.visualViewport,TYPING="input.field,textarea.field";
  var kb=function(){var a=document.activeElement,t=!!(a&&a.matches&&a.matches(TYPING));
    document.body.classList.toggle("typing",t&&VV.height<window.innerHeight*.8);};
  VV.addEventListener("resize",kb);
  document.addEventListener("focusin",kb);
  document.addEventListener("focusout",function(){setTimeout(kb,60);});
}
load();
try{history.replaceState({v:-1},"");}catch(e){}
render();
})();
</script>
